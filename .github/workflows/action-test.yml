name: Test Action

on:
  push:
    branches: [master]
    paths: [action.yml, .github/workflows/action-test.yml]
  pull_request:
    paths: [action.yml]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Test committer-go action (commits mode)
        uses: ./
        with:
          validate: commits
          count: 5
