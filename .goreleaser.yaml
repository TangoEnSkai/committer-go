version: 2

project_name: committer

before:
  hooks:
    - go mod verify

builds:
  - id: committer
    main: ./cmd/committer/main.go
    binary: committer
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: committer
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: TangoEnSkai
    name: committer-go
  name_template: "{{.ProjectName}} {{.Tag}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

brews:
  - name: committer-go
    repository:
      owner: TangoEnSkai
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/TangoEnSkai/committer-go"
    description: "Conventional Commits message validator with AI support"
    license: "MIT"
    skip_upload: auto
    install: |
      bin.install "committer"
    test: |
      system "#{bin}/committer", "lint", "feat: test brew install"
